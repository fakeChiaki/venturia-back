stages:
  - test
  - deploy

# Corre la suite unitaria. El stage de deploy solo procede si este pasa.
test:
  stage: test
  image: node:22-alpine
  only:
    - main
  before_script:
    - npm install -g pnpm@11
  script:
    - pnpm install --frozen-lockfile
    - pnpm run test

# Generación del archivo .env de producción, compartida por ambos destinos.
.env_setup:
  script:
    - |
      cat > .env.prod << EOF
      DB_USERNAME=$DB_USERNAME
      DB_PASSWORD=$DB_PASSWORD
      DB_NAME=$DB_NAME
      JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET
      JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET
      JWT_ACCESS_EXPIRATION=15m
      JWT_REFRESH_EXPIRATION=7d
      GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
      GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
      REDIS_HOST=redis
      REDIS_PORT=6379
      MAIL_HOST=$MAIL_HOST
      MAIL_PORT=$MAIL_PORT
      MAIL_USER=$MAIL_USER
      MAIL_PASS=$MAIL_PASS
      MAIL_FROM=$MAIL_FROM
      MINIO_ENDPOINT=$MINIO_ENDPOINT
      MINIO_ACCESS_KEY=$MINIO_ACCESS_KEY
      MINIO_SECRET_KEY=$MINIO_SECRET_KEY
      MINIO_BUCKET=$MINIO_BUCKET
      MINIO_PUBLIC_URL=$MINIO_PUBLIC_URL
      EOF

# Despliegue a la VPS existente (llave en base64 en SSH_PRIVATE_KEY).
deploy_vps:
  stage: deploy
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client git
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d > /tmp/ssh_key
    - chmod 400 /tmp/ssh_key
    - ssh-add /tmp/ssh_key
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
  script:
    - !reference [.env_setup, script]
    # URLs específicas de la VPS (dominio propio para OAuth por HTTPS)
    - echo "GOOGLE_CALLBACK_URL=$GOOGLE_CALLBACK_URL" >> .env.prod
    - echo "FRONTEND_URL=$FRONTEND_URL" >> .env.prod
    - scp .env.prod $SSH_USER@$SSH_HOST:/opt/venturia/.env
    - |
      ssh $SSH_USER@$SSH_HOST "
        set -e
        cd /opt/venturia
        git fetch origin main
        git checkout -f -B main origin/main
        docker compose -f docker-compose.prod.yml up -d --build
      "

# Despliegue a la instancia EC2 de producción (AWS).
# AWS_SSH_KEY es la llave privada codificada en base64 (evita corrupción por
# saltos de línea CRLF); se decodifica en el runner antes de usarla.
deploy_ec2:
  stage: deploy
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client git
    - eval $(ssh-agent -s)
    - echo "$AWS_SSH_KEY" | base64 -d > /tmp/aws_key
    - chmod 400 /tmp/aws_key
    - ssh-add /tmp/aws_key
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    - !reference [.env_setup, script]
    # URLs específicas de la EC2 (dominio propio para OAuth por HTTPS)
    - echo "GOOGLE_CALLBACK_URL=$EC2_GOOGLE_CALLBACK_URL" >> .env.prod
    - echo "FRONTEND_URL=$EC2_FRONTEND_URL" >> .env.prod
    - scp .env.prod $EC2_USER@$EC2_HOST:/opt/venturia/.env
    - |
      ssh $EC2_USER@$EC2_HOST "
        set -e
        cd /opt/venturia
        git fetch origin main
        git checkout -f -B main origin/main
        docker compose -f docker-compose.prod.yml up -d --build
      "
