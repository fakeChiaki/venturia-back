# Redirige todo el tráfico HTTP a HTTPS
server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # DNS interno de Docker: resuelve los nombres de los contenedores en tiempo
    # de request. Con proxy_pass por variable, nginx ya no exige que el upstream
    # exista al arrancar, así que sobrevive a un api/minio caído sin morir.
    resolver 127.0.0.11 valid=10s;

    location ~ ^/api/(.*)$ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/storage/(.*)$ {
        set $minio_upstream http://minio:9000;
        proxy_pass $minio_upstream/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
