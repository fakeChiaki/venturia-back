services:
  postgres:
    image: postgres:16-alpine
    container_name: venturia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-venturia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-venturia_dev}
      POSTGRES_DB: ${DB_NAME:-venturia}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-venturia} -d ${DB_NAME:-venturia}']
      interval: 5s
      timeout: 5s
      retries: 10

  # UI web para inspeccionar la base de datos: http://localhost:8080
  # (sistema: PostgreSQL, servidor: postgres, usuario/clave/db del .env)
  adminer:
    image: adminer:4
    container_name: venturia-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: venturia-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: venturia-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-venturia_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-venturia_minio_secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: venturia-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-venturia}
      DB_PASSWORD: ${DB_PASSWORD:-venturia_dev}
      DB_NAME: ${DB_NAME:-venturia}
      DB_MIGRATIONS_RUN: 'true'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-venturia_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-venturia_minio_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-venturia}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
